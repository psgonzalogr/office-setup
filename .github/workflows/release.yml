name: Publicar release

# Cuando «Validar instalador» pasa en main y la versión de office.ps1 todavía
# no tiene release, crea la etiqueta vX.Y.Z y la release con las notas del
# CHANGELOG (todas las versiones desde la release anterior) y el .cmd adjunto.
# También se puede lanzar a mano desde la pestaña Actions.
on:
  workflow_run:
    workflows: ['Validar instalador']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Nunca dos publicaciones a la vez (GitHub puede avisar el mismo CI dos veces).
concurrency:
  group: publicar-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Leer la versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(grep -oP "Version\s*=\s*'\K[0-9]+\.[0-9]+\.[0-9]+" office.ps1 | head -1)"
          echo "Versión en office.ps1: ${ver}"
          grep -q "^- \*\*${ver}\*\*" CHANGELOG.md || { echo "CHANGELOG.md no tiene la versión ${ver}"; exit 1; }
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          if gh release view "v${ver}" >/dev/null 2>&1; then
            echo "La release v${ver} ya existe: nada que hacer."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar las notas
        if: steps.ver.outputs.skip != '1'
        run: |
          ver="${{ steps.ver.outputs.ver }}"
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          prev="${prev#v}"
          {
            echo "## Novedades"
            echo
            awk -v ver="$ver" -v prev="$prev" '
              /^- \*\*/ { split($0, a, /\*\*/); v = a[2]; if (v == ver) on = 1; if (prev != "" && v == prev) on = 0 }
              on && /^- \*\*/ { print }
            ' CHANGELOG.md
            echo
            echo "## Cómo instalar"
            echo
            echo "Descarga \`Instalar-Office-SafeTech.cmd\` (abajo, en *Assets*) y ábrelo con doble clic, o pega esto en PowerShell:"
            echo
            echo '```powershell'
            echo 'irm https://raw.githubusercontent.com/psgonzalogr/office-setup/main/office.ps1 | iex'
            echo '```'
            echo
            echo "Historial completo: [CHANGELOG.md](https://github.com/psgonzalogr/office-setup/blob/main/CHANGELOG.md)"
          } > notas.md
          cat notas.md

      - name: Crear la release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.ver }}"
          gh release create "$tag" Instalar-Office-SafeTech.cmd \
            --target "$(git rev-parse HEAD)" --title "$tag" --notes-file notas.md --latest
